###############################################################################################################
# SD-WAN

{% extends "./sdwan.conf" %} {# shared jinja variables for SDWAN #}
{% block myconfig %}

config system zone
    edit "LAN"
        set interface "{{lan.port}}" "LAN_VOICE" "LAN_VIDEO"
    next
end

config firewall internet-service-custom
    edit "UDP5001"
        set reputation 5
        set comment ''
        config entry
            edit 1
                set protocol 17
                config port-range
                    edit 1
                        set start-port 5001
                        set end-port 5001
                    next
                end
                set dst "Corporate"
            next
        end
    next
    edit "UDP5002"
        set reputation 5
        set comment ''
        config entry
            edit 1
                set protocol 17
                config port-range
                    edit 1
                        set start-port 5002
                        set end-port 5002
                    next
                end
                set dst "Corporate"
            next
        end
    next
end

config firewall service custom
    edit "UDP/5002"
        set category "VoIP, Messaging & Other Applications"
        set udp-portrange 5002
    next
end


##### SD-WAN zones -----------------------------------------------

config system sdwan
    set status enable
    config zone
        # INTERNET zone is created, even if only SIA or RIA, because it is used for the SDWAN default route
        edit "INTERNET"
        next
        edit "VPN"
        next
    end
end

##### SD-WAN members -----------------------------------------------

config system sdwan
    config members
        # Internet Underlays
        edit 1
            set interface "{{wan.inet1.name}}"
            {{ "set gateway %s.254"%(wan.inet1.subnet) if not wan.inet1.dhcp }}
            set zone "INTERNET"
        next
        edit 2
            set interface "{{wan.inet2.name}}"
            {{ "set gateway %s.254"%(wan.inet2.subnet) if not wan.inet2.dhcp }}
            set zone "INTERNET"
        next
        edit 3
            set interface "{{wan.inet3.name}}"
            {{ "set gateway %s.254"%(wan.inet3.subnet) if not wan.inet3.dhcp }}
            set zone "INTERNET"
        next

        # Overlays
        {% for member in ipsec_overlays %}
            {% if member.cross_underlay and not full_mesh_ipsec %}
                {% continue %}
            {% endif %}
            edit {{member.id}}
                set interface "{{member.interface}}"
                set zone "VPN"
                {{ "set source %s"%(loopback) if overlay == 'no_ip' }}
#                 set priority 20
                set status {{member.status}}
                set transport-group {{member.transport_group}}
                set priority-in-sla {{member.priority_in_sla}}
                set priority-out-sla {{member.priority_out_sla}}
            next
        {% endfor %}
    end
end

### SD-WAN health-checks -----------------------------------------------

{# Build the list of SLA members for each health-check #}

{# members for SLA_VPN #}
{% set sla_dc_members = [] -%} {# Must contain all overlay tunnels #}
{% for ov in ipsec_overlays -%}
    {% if ov.cross_underlay and not full_mesh_ipsec -%}
        {% continue -%}
    {% endif -%}

    {% do sla_dc_members.append(ov.id) -%}
{% endfor -%}

config system sdwan
    config health-check
        delete "Default_DNS"
        delete "Default_Office_365"
        delete "Default_Gmail"
        delete "Default_Google Search"
        delete "Default_FortiGuard"
        edit "SLA_VPN"
            set server 10.200.{{region_id}}.254
            set sla-fail-log-period 10
            set sla-pass-log-period 10
            set mos-codec g729
            set probe-timeout 1000
            set members {{ sla_dc_members|join(' ') }}
            set embed-measured-health enable
            set sla-id-redistribute 1
            config sla
                edit 1
                    set link-cost-factor latency packet-loss
                    set latency-threshold 150
                    set packetloss-threshold 1
                next
                edit 2
                    set link-cost-factor mos
                    set mos-threshold "4.0"
                next
                edit 3
                    set link-cost-factor packet-loss
                    set packetloss-threshold 1
                next
            end
        next
        edit "SLAv6_VPN"
            set addr-mode ipv6
            set server "2000:10:200:{{region_id}}::254"
            set probe-timeout 1000
            set embed-measured-health enable
            set sla-id-redistribute 1
            set sla-fail-log-period 10
            set sla-pass-log-period 10
            set members {{ sla_dc_members|join(' ') }}
            set mos-codec g729
            config sla
                edit 1
                    set link-cost-factor latency packet-loss
                    set latency-threshold 150
                    set packetloss-threshold 1
                next
                edit 2
                    set link-cost-factor mos
                    set mos-threshold "4.0"
                next
            end
        next
    end
end

### SD-WAN with ADVPN v2.0 -----------------------------------------------

config system sdwan
    config zone
        edit "VPN"
            set advpn-select enable
            set advpn-health-check "SLA_VPN"
        next
    end
end

### SD-WAN rules -----------------------------------------------

# -- Rules for local-out traffic (BGP, PIM, etc...)

config system sdwan
    config service
        edit 1000
            set name "BGP"
            set mode sla
            set protocol 6
            set start-port 179
            set end-port 179
            set src "lo-BGP"
            set dst "lo-BGP-global-summary"
            config sla
                edit SLA_VPN
                    set id 1
                next
            end
            set priority-members 11 22 33
            # fib-best-match required otherwise BGP peering to HUB2 tries to flow via the tunnels to HUB1 (matching summary/default route)
            # Peering to HUB's loopback must flow where the looback/32 route was created by IKE exchange-interface-ip
            # set tie-break fib-best-match
        next
        edit 1001
            set name "PIM"
            set mode sla
            set protocol 103
            set src "all"
            set dst "all"
            config sla
                edit SLA_VPN
                    set id 2
                next
            end
            set priority-members 11 22 33
            set shortcut disable
            set use-shortcut-sla disable
        next
    end
end

# --- Rules to VPN

config system sdwan
    config service
        edit 9
            set name "force_single_link_for_FEC"
            set src "Corporate"
            set internet-service enable
            set internet-service-custom "UDP5001"
            set priority-members 11
        next
        edit 1
            set name "VPN"
            set mode sla
            set src "Corporate"
            set dst "Corporate"
            # set hold-down-time 20
            config sla
                edit "SLA_VPN"
                    set id 1
                next
            end
            set priority-members 11 22 33
        next
        edit 2
            set name "VPN_6"
            set addr-mode ipv6
            set mode sla
            set src6 "Corporate"
            set dst6 "Corporate"
            # set hold-down-time 20
            config sla
                edit "SLAv6_VPN"
                    set id 1
                next
            end
            set priority-members 11 22 33
        next
    end
end

