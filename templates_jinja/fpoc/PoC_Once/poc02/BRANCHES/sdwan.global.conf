# ---- SD-WAN duplication, session in BRANCH->HUB direction
#
# on-demand duplication is fired by sla(0x0) due to using 'sla-match-service enable'
# A specific SLA Target #3 with only packet-loss as link-cost-factor is used so that sla pass/fail is only triggered
# by packet-loss status
# udp/5002 sessions are forced to stick to a single sdwan member otherwise the sessions would failover to another sdwan
# member when pkt loss is detected.

config system sdwan
    config service
        edit 6
            set name "force_single_link_for_DUP"
            set mode sla
            set src "Corporate"
            set internet-service enable
            set internet-service-custom "UDP5002"
            config sla
                edit "SLA_VPN"
                    set id 3
                next
            end
            set priority-members 11
        next
        move 6 before 9
    end
    config duplication
        edit 1
            set service-id 6
            set packet-duplication on-demand
            set sla-match-service enable
            set packet-de-duplication enable
        next
    end
end

# ---- SD-WAN duplication, for shortcut sessions

config system sdwan
    config duplication
        edit 2
            set srcaddr "Corporate"
            set dstaddr "Corporate"
            set srcintf "VPN"
            set dstintf "LAN"
            set service "UDP/5002"
            set packet-duplication on-demand
            set packet-de-duplication enable
        next
    end
end

# ---- SD-WAN duplication, session in HUB->BRANCH direction
#
# No service-id can be referenced in this session direction since the members of "LAN" system zone are not sdwan members
