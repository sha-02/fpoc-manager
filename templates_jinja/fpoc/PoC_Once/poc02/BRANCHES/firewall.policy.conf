###############################################################################################################
# FW Policies
# no IPS profile is applied because IPS process did not start correctly when mixing AppCtrl + IPS profiles

config application list
    edit "appctrl_poc"
        set comment "Monitor all applications."
        config entries
            edit 255
                set application 7930 7931 7932
                set action pass
            next
            edit 1
                set action pass
            next
        end
    next
end

# Policies

config system zone
    edit "LAN"
        set interface {{lan.port}}
    next
end

config firewall policy
    edit 1000
        set name "ADVPN BGP Peerings - SDWAN HC"
        set srcintf "VPN"
        set dstintf "lo-BGP"
        set srcaddr "lo-BGP-global-summary"
        set dstaddr "lo-BGP"
        set srcaddr6 "lo-BGP-global-summary"
        set dstaddr6 "lo-BGP"
        set action accept
        set schedule "always"
        set service "BGP" "PING" "PING6"
        set logtraffic disable
        set comments "BGP peerings and SDWAN health-checks from Branches"
        set global-label "HEADER"
    next
    edit 9
        set name "FEC for UDP/5001"
        set srcintf "LAN" "VPN"
        set dstintf "LAN" "VPN"
        set action accept
        set srcaddr "Corporate"
        set internet-service enable
        set internet-service-custom "UDP5001"
        set schedule "always"
        set logtraffic all
        set fec enable
        set comments "IPsec FEC for UDP/5001 sessions"
        set global-label "VPN"
    next
    edit 10
        set name "Corporate Out"
        set srcintf "LAN"
        set dstintf "VPN"
        set srcaddr "Corporate"
        set dstaddr "Corporate"
        set srcaddr6 "Corporate"
        set dstaddr6 "Corporate"
        set action accept
        set utm-status enable
        set ssl-ssh-profile "deep-inspection"
        set application-list "appctrl_poc"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "Corporate Services"
        {% if not npu %}
            set passive-wan-health-measurement enable
            set app-monitor enable
            set auto-asic-offload disable
        {% endif %}
#         set global-label "VPN"
    next
    edit 11
        set name "Corporate In"
        set srcintf "VPN"
        set dstintf "LAN"
        set srcaddr "Corporate"
        set dstaddr "Corporate"
        set srcaddr6 "Corporate"
        set dstaddr6 "Corporate"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "no UTM inbound - it is applied outbound"
        {% if not npu %}
            set passive-wan-health-measurement enable
            set app-monitor enable
            set auto-asic-offload disable
        {% endif %}
#         set global-label "VPN"
    next
end
