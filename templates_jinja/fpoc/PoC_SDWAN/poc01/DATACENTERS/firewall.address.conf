{% if ipv6 %}
    config firewall address6
        edit "Corporate"
            set ip6 {{"10.0.0.0/8"|ipv4_to_ipv6}}
        next
        edit "lo-SDWAN-HC"
            set ip6 {{("10.200.%s.254/32"%region_id)|ipv4_to_ipv6}}
        next
        edit "lo-BGP"
            set ip6 {{loopback|ipv4_to_ipv6}}/128
        next
        edit "lo-BGP-global-summary"
            set ip6 {{"10.200.0.0/16"|ipv4_to_ipv6}}
        next
        edit "lo-BGP-regional-summary"
            set ip6 {{("10.200.%s.0/24"%region_id)|ipv4_to_ipv6}}
        next
    end
{% endif %}

# For IPsec FEC (udp/5001) and SD-WAN Duplication (udp/5002)

config firewall internet-service-custom
    edit "UDP5001"
        set reputation 5
        set comment ''
        config entry
            edit 1
                set protocol 17
                config port-range
                    edit 1
                        set start-port 5001
                        set end-port 5001
                    next
                end
                set dst "Corporate"
            next
        end
    next
    edit "UDP5002"
        set reputation 5
        set comment ''
        config entry
            edit 1
                set protocol 17
                config port-range
                    edit 1
                        set start-port 5002
                        set end-port 5002
                    next
                end
                set dst "Corporate"
            next
        end
    next
end

config firewall service custom
    edit "UDP/5001"
        set category "VoIP, Messaging & Other Applications"
        set udp-portrange 5001
    next
    edit "UDP/5002"
        set category "VoIP, Messaging & Other Applications"
        set udp-portrange 5002
    next
end

