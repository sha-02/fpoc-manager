{% if multicast %}

config system settings
    set multicast-forward disable
    set multicast-ttl-notchange enable
    set gui-multicast-policy enable
end

config firewall multicast-policy
    edit 1
        set name "permit all"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
    next
end


{% set edge_tunnels = [ 'EDGE_INET1', 'EDGE_INET2', 'EDGE_MPLS' ] -%}

{# Intra-Regional and Inter-Regional tunnels #}
{% if region_id == 1 -%}
    {% set intra_regional_tunnels = [ 'H1H2' ] -%}
    {% set inter_regional_tunnels = [ 'EAST1_INET1', 'EAST1_INET2', 'EAST1_MPLS' ] -%}
{% else -%} {# East region #}
    {% set intra_regional_tunnels = [] -%}
    {% set inter_regional_tunnels = [ 'WEST1_INET1', 'WEST1_INET2', 'WEST1_MPLS', 'WEST2_INET1', 'WEST2_INET2', 'WEST2_MPLS' ] -%}
{% endif -%}

# PIM-SM is enabled on:
# - lan.port because this is where the mcast senders are located
# - lo-BGP because it is where the RP address is defined (no vrf_segmentation)
# - lo-RP-xxx because it is where the RP address is defined (vrf_segmentation)
# - Edge tunnels towards the Branches
# - the intra-regional tunnels because intra-regional multicast can happen (e.g. between WEST-DC1 and WEST-DC2)
# - the inter-regional tunnels because inter-regional multicast is allowed

config router multicast
    set multicast-routing enable
    config pim-sm-global
        # Control local-out PIM with an SD-WAN rule
        set pim-use-sdwan enable
    end
    config interface
        {% for edge_tunnel in edge_tunnels %}
            edit "{{edge_tunnel}}"
                set pim-mode sparse-mode
                {{ "set update-source lo-BGP" if overlay == 'no_ip' }}
            next
        {% endfor %}
        {% for regional_tunnel in intra_regional_tunnels+inter_regional_tunnels %}
            edit "{{regional_tunnel}}"
                set pim-mode sparse-mode
                {{ "set update-source lo-BGP" if overlay == 'no_ip' }}
            next
        {% endfor %}
    end
end

{% if not vrf_segmentation %} {# ################### No VRF segmentation ############# #}
config router multicast
    config interface
        edit "lo-BGP"
            set pim-mode sparse-mode
        next
        edit "{{lan.port}}"
            set pim-mode sparse-mode
            set passive enable
            config igmp
                set access-group "multicast-groups"
            end
        next
    end

    {# Rendez-vous Points #}
    {% if vrf_pe == 0 %}
        # "pim-sm-global" is used for RPs in VRF 0
        config pim-sm-global
    {% else %} {# vrf_pe<>0 #}
        # "pim-sm-global-vrf" is used for RPs in VRF <> 0
        config pim-sm-global-vrf
        edit {{vrf_pe}}
    {% endif %} {# vrf_pe == 0 #}

        config rp-address
            edit 1
                set ip-address {{rendezvous_points['WEST-DC1']}}
                set group "multicast-west-dc1"
            next
            edit 2
                set ip-address {{rendezvous_points['WEST-DC2']}}
                set group "multicast-west-dc2"
            next
            edit 3
                set ip-address {{rendezvous_points['EAST-DC1']}}
                set group "multicast-east-dc1"
            next
        end
    end
    {% if vrf_pe != 0 %}
    end
    {% endif %} {# vrf_pe<>0 #}
end
{% endif %} {# no vrf_segmentation #}

{% if vrf_segmentation %} {# ################### VRF segmentation ############# #}
config router multicast
    config interface
        {% for vrf_name in vrf_segments.keys() %}
            edit "lo-RP-{{vrf_name}}"
                set pim-mode sparse-mode
            next
        {% endfor %}
        {% for vrf_name, segment in vrf_segments.items() %}
            edit "{{segment.name}}"
                set pim-mode sparse-mode
                set passive enable
                config igmp
                    set access-group "multicast-{{vrf_name|lower}}"
                end
            next
        {% endfor %}
    end

    {# Rendez-vous Points #}
    config pim-sm-global-vrf
        edit {{vrf_blue}}
            config rp-address
                edit 1
                    set ip-address {{rendezvous_points['WEST-DC1']}}
                    set group "multicast-blue"
                next
            end
        next
        edit {{vrf_yellow}}
            config rp-address
                edit 1
                    set ip-address {{rendezvous_points['WEST-DC2']}}
                    set group "multicast-yellow"
                next
            end
        next
        edit {{vrf_red}}
            config rp-address
                edit 1
                    set ip-address {{rendezvous_points['EAST-DC1']}}
                    set group "multicast-red"
                next
            end
        next
        edit {{vrf_grey}}
            config rp-address
                edit 1
                    set ip-address {{rendezvous_points['WEST-DC1']}}
                    set group "multicast-grey"
                next
            end
        next
    end
end
{% endif %} {# vrf_segmentation #}

{% endif %} {# multicast #}
