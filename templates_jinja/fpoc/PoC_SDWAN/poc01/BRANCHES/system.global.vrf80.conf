{% if vrf_segmentation %}

{% extends "./sdwan.conf" %} {# shared jinja variables for SDWAN #}
{% block myconfig %}

config router vrf
{% for vrf_name, segment in vrf_segments.items() %}
    edit "{{segment.vrfid}}"
        set name "{{vrf_name|upper}}"
    next
{% endfor %}
end

{% endblock %} {# sdwan.conf #}
{% endif %} {# VRF segmentation #}


