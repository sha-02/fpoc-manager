{% extends "./sdwan.conf" %} {# shared jinja variables for SDWAN #}
{% block sdwan %}

{# SD-WAN duplication must be defined after LAN zone #}

# -- SD-WAN Duplication rules

config system sdwan
    config duplication
        # towards HUB1 or another Branch
        edit 1
            set service-id 52
            set packet-duplication on-demand
            set packet-de-duplication enable
            set sla-match-service enable
            {{ "set members %d %d %d"%(memberID['H1_INET1'], memberID['H1_INET2'], memberID['H1_MPLS']) if FOS >= 8_000_000 }}
        next
        # from HUB1 or another Branch
        edit 2
            set srcintf "VPN"
            set srcaddr "Corporate"
            set dstintf "LAN"
            set dstaddr "Corporate"
            set service "UDP/5002"
            set packet-duplication on-demand
            set packet-de-duplication enable
            {{ "set members %d %d %d"%(memberID['H1_INET1'], memberID['H1_INET2'], memberID['H1_MPLS']) if FOS >= 8_000_000 }}
        next
    end
end

{% endblock %} {# sdwan.conf #}

