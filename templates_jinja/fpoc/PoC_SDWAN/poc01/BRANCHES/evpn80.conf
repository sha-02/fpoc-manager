{% if evpn %}
#
# EVPN config for FOS 8.0
#

{% set asn = 65000 + region_id %}

# L3EVPN is NOT used with SD-WAN design
# Using L3EVPN causes L2EVPN xtd-subnets traffic to egress over the L3EVPN which causes RPF issues on the recipient branch
# For DataCenters EVPN it is valid to use L3EVPN since all subnets are L2EVPN subnets and they are all interconnected via the same L3EVPN
# That's not the design of SD-WAN: only some/few subnets are L2EVPN, all other subnets are not
{% set l3evpn = false %}

# Below settings should not be required due to distributing evpn host/32 routes to the HUBs and shortcuts
# config system settings
#     set tcp-session-without-syn enable
#     set asymroute-icmp enable
# end
{% set distribute_evpn_route = true %}

config system interface
    edit "LAN_XTD"
        set vdom "root"
        set type vlan
        set interface "{{lan_xtd.intf.port}}"
        set vlanid {{lan_xtd.intf.vlanid}}
        set vrf {{vrf_evpn}}
    next
end

{% if l3evpn %}
    # L3EVPN (ipvrf)
    config system evpn
        edit {{lan_xtd.l3evpnid}}
            set type ipvrf
            set import-rt "{{asn}}:{{lan_xtd.l3vni}}"
            set export-rt "{{asn}}:{{lan_xtd.l3vni}}"
            # An interface is required for L3EVPN
            set interface "lo-BGP"
        next
    end
{% endif %}

config system evpn
    # L2EVPN (macvrf)
    edit {{lan_xtd.evpnid}}
        set type macvrf
        set import-rt "{{asn}}:{{lan_xtd.l2vni}}"
        set export-rt "{{asn}}:{{lan_xtd.l2vni}}"

        # Anycast GW
        # ‘arp-suppression’ is always enabled and CLI removed when anycast gw is configured
        set adv-default-gw enable
        set virtual-mac-vrid {{lan_xtd.evpnid}}

        {% if l3evpn %}
        # ‘ip-local-learning’ is always enabled and CLI removed for L2 EVPN instances linked to an L3 EVPN instance
        # L2 EVPN instances that need L3 service are linked to the L3 EVPN instance with 'set l3-instance'
            set l3-instance {{lan_xtd.l3evpnid}}
        {% else %}
            set ip-local-learning enable
        {% endif %}

        {% if distribute_evpn_route %}
            # Generates BGP IPv4 NLRI (host /32) for each EVPN Type2 MAC-IP binding
            # Must be combined with 'set adv-evpn-route' in BGP neighbor to Hubs
            set distribute-local-route enable
        {% endif %}
    next
end

config system vxlan
    edit "vxlan.{{lan_xtd.l2vni}}"
        {% if l3evpn %}
            # The interface setting is inherited from the EVPN configuration when it is configured with 'l3-instance'
        {% else %}
            set interface "lo-BGP"
        {% endif %}
        set vni {{lan_xtd.l2vni}}
        set evpn-id {{lan_xtd.evpnid}}
    next
    {% if l3evpn %}
        edit "EVPN.{{lan_xtd.l3vni}}"
            set vni {{lan_xtd.l3vni}}
            set evpn-id {{lan_xtd.l3evpnid}}
        next
    {% endif %}
end

config system switch-interface
    edit "EVPN.{{lan_xtd.l2vni}}"
        set vdom "root"
        set member "LAN_XTD" "vxlan.{{lan_xtd.l2vni}}"
        set intra-switch-policy explicit
    next
end

config system interface
    edit "EVPN.{{lan_xtd.l2vni}}"
        set ip {{lan_xtd.intf.ipmask}}
        set allowaccess ping
        set vrf {{vrf_evpn}}
    next
end

# Add the LAN_XTD to the subnets to be advertised to the Hubs
# Do not add a tag of 32768 because we don't want to advertise this subnet to ADVPN peers
config router route-map
    edit "LAN_INTERFACES"
        config rule
            edit 0
                set match-interface "EVPN.{{lan_xtd.l2vni}}"
           next
        end
    next
end

# However we want to advertise over the shortcut the evpn host /32 within this extended subnet
# These routes have the local BGP loopback as BGP NH and the RT extcommunity for the L2VNI
config router prefix-list
    edit "bgp_loopback"
        config rule
            edit 1
                set prefix {{loopback}} 255.255.255.255
                unset ge
                unset le
            next
        end
    next
end

config router extcommunity-list
    edit "L2VNI_{{lan_xtd.l2vni}}"
        config rule
            edit 1
                set action permit
                set match "{{asn}}:{{lan_xtd.l2vni}}"
            next
        end
    next
end

config router route-map
    edit "ADVPN_OUT"
        config rule
            edit 0
                set action permit
                set match-extcommunity "L2VNI_{{lan_xtd.l2vni}}"
                set match-ip-nexthop "bgp_loopback"
            next
        end
    next
end

config router bgp
    config neighbor
        {% for dc in datacenter.values() %}
            edit "{{dc.loopback}}"
                set capability-graceful-restart-evpn enable
                set soft-reconfiguration-evpn enable
                {% if distribute_evpn_route %}
                    # Advertise evpn host/32 to the Hubs so that they now the precise location of each host instead
                    # of only knowing that the same extended subnet is located behind multiple branches
                    # Must be combined with 'set distribute-local-route enable' in evpn config
                    set adv-evpn-route local
                {% endif %}
            next
        {% endfor %}
    end
    config neighbor-group
        edit "ADVPN_INTRA_REGION"
            set activate-evpn disable
            {% if distribute_evpn_route %}
                # Needed for the case where two branches (eg, BR1 & BR2) share the same xtd-subnet (eg 10.99.12.0/24)
                # and BR1 host 10.99.12.101 sends traffic to a non-xtd-subnet on BR2 (eg, 10.0.2.0/24) over the shortcut
                # On BR2, there is no route back to 10.99.12.101 over the shortcut -> RPF failure.
                # The only routes back over the shortcut is BR1 10.0.1.0/24
                # 10.99.12.0/24 was also advertised by BR1 to BR2 over the shortcut but since it is a connected subnet
                # on BR2 (associated to EVPN.10010) then this BGP route does not make it to the RIB/FIB.
                # Advertise evpn host/32 to the peering Branches so that the
                # Must be combined with 'set distribute-local-route enable' in evpn config
                set adv-evpn-route local
            {% endif %}
        next
        edit "ADVPN_REGIONS"
            set activate-evpn disable
            {% if distribute_evpn_route %}
                # Branches in different regions should not share the same xtd subnet so there is no reason to advertise
                # the local xtd-subnet hosts over inter-regional shortcut BGP peerings
            {% endif %}
        next
    end
end

config firewall policy
    edit 20  {# Layer2 EVPN #}
        set name "L2VNI"
        set srcintf "LAN_XTD" "vxlan.{{lan_xtd.l2vni}}"
        set dstintf "LAN_XTD" "vxlan.{{lan_xtd.l2vni}}"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set global-label "EVPN"
    next
    edit 21 {# Layer3 EVPN #}
        set name "EVPN IN"
        set srcintf "LAN" "VPN"
        set dstintf "EVPN.{{lan_xtd.l2vni}}" {{ "EVPN."~lan_xtd.l3vni if l3evpn }}
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set anti-replay disable
        set tcp-session-without-syn all
    next
    edit 22
        set name "EVPN OUT"
        set srcintf "EVPN.{{lan_xtd.l2vni}}" {{ "EVPN."~lan_xtd.l3vni if l3evpn }}
        set dstintf "LAN" "VPN"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set anti-replay disable
        set tcp-session-without-syn all
    next
    {% if l3evpn %}
        edit 23
            set name "EVPN"
            set srcintf "EVPN.{{lan_xtd.l2vni}}" "EVPN.{{lan_xtd.l3vni}}"
            set dstintf "EVPN.{{lan_xtd.l2vni}}" "EVPN.{{lan_xtd.l3vni}}"
            set action accept
            set srcaddr "all"
            set dstaddr "all"
            set schedule "always"
            set service "ALL"
            set logtraffic disable
            set anti-replay disable
            set tcp-session-without-syn all
        next
    {% endif %}
end

{% endif %} {# evpn #}
