{% extends "./ipsec.conf" %} {# shared jinja variables for SDWAN #}
{% block ipsec %}

config vpn ipsec fec
    edit "fec_profile"
        config mappings

            # High >=5% , overhead 75%
            edit 1
                set packet-loss-threshold 5
                set base 4
                set redundant 3
            next

            # Medium [2%; 5%[ , overhead 50%
            edit 2
                set packet-loss-threshold 2
                set base 6
                set redundant 3
            next

            # Low [1%; 2%[ , overhead 30%
            edit 3
                set packet-loss-threshold 1
                set base 10
                set redundant 3
            next

            # loss < 1% cannot be disabled with FOS 7.6, overhead 5%
            edit 4
                set base 20
                set redundant 1
            next

        end
    next
end

{%- for phase1 in phase1s %}
    {% if phase1.cross_underlay and not full_mesh_ipsec %}
        {% continue %}
    {% endif %}
    config vpn ipsec phase1-interface
        edit "{{phase1.name}}"
            set fec-egress enable
            set fec-ingress enable
            set fec-codec rs
            set fec-base 20
            set fec-redundant 1
            set fec-health-check "SLA_VPN"
            set fec-mapping-profile "fec_profile"
        next
    end
    {% if FOS < 8_000_000 %}
        # Up to FOS 7.6, anti-replay must be disabled on IPsec tunnels when mixing fec and non-fec traffic over the same tunnel
        # Fixed with the new IPsec FEC design in FOS 8.0
        config vpn ipsec phase2-interface
            edit "{{phase1.name}}"
                set replay disable
            next
            {% if ipv6 %}
                edit "{{phase1.name}}_v6"
                    set replay disable
                next
            {% endif %}
        end
    {% endif %}
{% endfor %}

{% endblock %} {# ipsec.conf #}