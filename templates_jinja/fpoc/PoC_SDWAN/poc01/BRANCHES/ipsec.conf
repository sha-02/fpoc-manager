        'networkid': dc2.id~'1', 'localid': name~'_INET2', 'status': 'up' if region_id == 1 else 'down',
        'ip': overlay1~'.'~dc2.id~'.2'~branch_id, 'remote_ip':overlay1~'.'~dc2.id~'.254', 'cross_underlay': true,
    },
    ]
-%}

