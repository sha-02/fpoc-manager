{% if multicast %}
###############################################################################################################
# Multicast

config router access-list
    edit "multicast-ssm-232"
        config rule
            edit 1
                set prefix 232.0.0.0 255.0.0.0
            next
        end
    next
end

{% if not vrf_segmentation %} {################################################################################}
# Each DC is rendez-vous point for a multicast group subnet
# WEST-DC1 for mcast groups in 239.1.1.0/24
# WEST-DC2 for mcast groups in 239.1.2.0/24
# EAST-DC1 for mcast groups in 239.2.1.0/24
# The generic convention is 239.<region-id>.(dc-number).0/24

{% set mc_239_1_1 = "239.1.1.0" %}
{% set mc_239_1_2 = "239.1.2.0" %}
{% set mc_239_2_1 = "239.2.1.0" %}
config router access-list
    edit "multicast-239-1-1"
        config rule
            edit 1
                set prefix {{mc_239_1_1}} 255.255.255.0
            next
        end
    next
    edit "multicast-239-1-2"
        config rule
            edit 1
                set prefix {{mc_239_1_2}} 255.255.255.0
            next
        end
    next
    edit "multicast-239-2-1"
        config rule
            edit 1
                set prefix {{mc_239_2_1}} 255.255.255.0
            next
        end
    next
    edit "multicast-groups"
        config rule
            edit 1
                set prefix {{mc_239_1_1}} 255.255.255.0
            next
            edit 2
                set prefix {{mc_239_1_2}} 255.255.255.0
            next
            edit 3
                set prefix {{mc_239_2_1}} 255.255.255.0
            next
            edit 4
                set prefix 232.0.0.0 255.0.0.0
            next
        end
    next
end

{% endif %} {# no vrf_segmentation #}

{% if vrf_segmentation %} {################################################################################}
# Each DC is rendez-vous point for a multicast group subnet in a specific VRF
# WEST-DC1 for mcast in VRF blue and in VRF grey (but there is no grey VRF in branches, it is just done to keep the Hub template simpler)
# WEST-DC2 for mcast in VRF yellow
# EAST-DC1 for mcast in VRF red
# The generic convention is 239.<vrfid>.<vrfid>.0/24

{% set blue = "239.%s.%s.0"%(vrf_blue,vrf_blue) %}
{% set yellow = "239.%s.%s.0"%(vrf_yellow,vrf_yellow) %}
{% set red = "239.%s.%s.0"%(vrf_red,vrf_red) %}
{% set grey = "239.%s.%s.0"%(vrf_grey,vrf_grey) %}
config router access-list
    edit {{"multicast-239-%s-%s"%(vrf_blue,vrf_blue)}}
        config rule
            edit 1
                set prefix {{blue}} 255.255.255.0
            next
        end
    next
    edit {{"multicast-239-%s-%s"%(vrf_yellow,vrf_yellow)}}
        config rule
            edit 1
                set prefix {{yellow}} 255.255.255.0
            next
        end
    next
    edit {{"multicast-239-%s-%s"%(vrf_red,vrf_red)}}
        config rule
            edit 1
                set prefix {{red}} 255.255.255.0
            next
        end
    next
    edit {{"multicast-239-%s-%s"%(vrf_grey,vrf_grey)}}
        config rule
            edit 1
                set prefix {{grey}} 255.255.255.0
            next
        end
    next
end

{% endif %} {# vrf_segmentation #}

{% endif %} {# multicast #}