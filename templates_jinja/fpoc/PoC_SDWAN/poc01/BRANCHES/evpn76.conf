{% if evpn %}
#
# EVPN config for FOS 7.6
#

# Non-working case
# ================
# BR1 and BR2 share the same extended LAN 10.99.12.0/24
# BR1-XTD (10.99.12.101) sends traffic to another subnet of BR2-LXC (10.0.2.101)
# Traffic sourced from the EVPN must *not* be sent over shortcuts
# The reason is:
# When the shortcut is up, if BR1-XTD 10.99.12.101 sends traffic to BR2-LXC 10.0.2.101, the packet
# (src=10.99.12.101, dst=10.0.2.101) is received by BR2 over the shortcut H1_INET1_0
# But there is no route back to 10.99.12.101 over H1_INET1_0
# The only existing routes on BR2 over H1_INET1_0 are:
# - 10.0.1.0/24, the subnet of BR1-LXC learned via the dynamic BGP peering over shortcut
# - 10.200.1.1/32, the loopback IP of BR1 learned from IPsec exchange-interface-ip
# So, RPF failure occurs
# BR2 learned subnet 10.99.12.0/24 via the dynamic BGP peering over the shortcut. But because BR2 also has the same
# subnet as EVPN, then 10.99.12.0/24 is a connected subnet and it cannot ECMP with the BGP-learned subnet
#
# WEST-BR2 # alias bgp_network
# * i10.99.12.0/24    10.200.1.1      0             100      0        0 ? <-/->
# *>                  0.0.0.0                            32768        0 ? <-/1>
#
# WEST-BR2 # alias rib
# C       10.99.12.0/24 is directly connected, EVPN.10010
#
# There is no way to "associate" 10.99.12.0/24 to the dynamic shortcut interface
#
# So, I created an sdwan rule to ensure traffic coming from the EVPN on BR1 does not use the shortcut
# Traffic from BR1-XTD now reaches BR2 via the HUB overlays. Since there is a default route via all overlays,
# then the packet is not rejected by RPF.
#
# But that does not fix the issue because the reply packet is sent back to HUB1 which causes a routing loop !
#
# On BR2, the original packet (say, SYN) was received from H1_INET1 and sent out port5: session is created with these
# interfaces. While FOS allows the SYN-ACK packet to come back from another interface than port5, FOS (by default) enforces
# that the SYN-ACK packet be forwarded out the same interface which received the SYN.
# So the SYN-ACK goes back to the HUB, which sends it back to BR2, which sends it back to the HUB, etc... routing loop
# A workaround could be to use aux-sessions but it's a pandora box for sdwan.
#
# So failure happens for traffic flows where a branch receives traffic sourced from an subnet which is considered
# locally connected.
#
# Maybe a (ugly) solution could be to NAT traffic which are routed out of the EVPN...
#
# The right solution is to use FOS 8.0 and distribute evpn /32 routes to the Hubs and over the shortcuts


{% set asn = 65000 + region_id %}

# In order to deal with the natural IRB asymmetry caused by traffic flow routed to/from an EVPN, we must :
# - create FW policies for traffic in/out the L2VNI with tcp-without-syn (for TCP)
#     . For UDP is works because there is a policy for each direction
# - enable 'asymroute-icmp' in system.settings otherwise PING fails
#     . PING, like TCP, has a direction (echo-request and echo-response) so FGT refuses to see the echo-response
#       if it does not have an existing session created for the echo-request.

config system settings
    set tcp-session-without-syn enable
    set asymroute-icmp enable
end

config system interface
    edit "LAN_XTD"
        set vdom "root"
        set type vlan
        set interface "{{lan_xtd.intf.port}}"
        set vlanid {{lan_xtd.intf.vlanid}}
        set vrf {{vrf_evpn}}
    next
end

config system evpn
    # L2EVPN
    edit {{lan_xtd.evpnid}}
        set import-rt "{{asn}}:{{lan_xtd.l2vni}}"
        set export-rt "{{asn}}:{{lan_xtd.l2vni}}"
        set ip-local-learning enable
        set arp-suppression enable
    next
end

config system vxlan
    edit "vxlan.{{lan_xtd.l2vni}}"
        set interface "lo-BGP"
        set vni {{lan_xtd.l2vni}}
        set evpn-id {{lan_xtd.evpnid}}
#         set learn-from-traffic enable
    next
end

config system switch-interface
    edit "EVPN.{{lan_xtd.l2vni}}"
        set vdom "root"
        set member "LAN_XTD" "vxlan.{{lan_xtd.l2vni}}"
        set intra-switch-policy explicit
    next
end

config system interface
    edit "EVPN.{{lan_xtd.l2vni}}"
        set ip {{lan_xtd.intf.ipmask}}
        set allowaccess ping
        set vrf {{vrf_evpn}}
    next
end

config router route-map
    edit "LAN_INTERFACES"
        config rule
            edit 0
                set match-interface "EVPN.{{lan_xtd.l2vni}}"
                set set-tag 32768
           next
        end
    next
end

config router bgp
    config neighbor
        {% for dc in datacenter.values() %}
            edit "{{dc.loopback}}"
                set capability-graceful-restart-evpn enable
                set soft-reconfiguration-evpn enable
            next
        {% endfor %}
    end
    config neighbor-group
        edit "ADVPN_INTRA_REGION"
            set activate-evpn disable
        next
        edit "ADVPN_REGIONS"
            set activate-evpn disable
        next
    end
end

config firewall policy
    edit 20  {# Layer2 EVPN #}
        set name "L2VNI"
        set srcintf "LAN_XTD" "vxlan.{{lan_xtd.l2vni}}"
        set dstintf "LAN_XTD" "vxlan.{{lan_xtd.l2vni}}"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set global-label "EVPN"
    next
    edit 21 {# Layer3 EVPN #}
        set name "EVPN IN"
        set srcintf "LAN" "VPN"
        set dstintf "EVPN.{{lan_xtd.l2vni}}"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set anti-replay disable
        set tcp-session-without-syn all
    next
    edit 22
        set name "EVPN OUT"
        set srcintf "EVPN.{{lan_xtd.l2vni}}"
        set dstintf "LAN" "VPN"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set anti-replay disable
        set tcp-session-without-syn all
    next
end

{% endif %} {# evpn #}
