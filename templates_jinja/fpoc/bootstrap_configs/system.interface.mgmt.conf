{# OOB management interface #}

{% if mgmt.vlanid == 0 %}
    config system interface
        edit "{{mgmt.interface}}"
            set vdom "root"
            set mode static
            set ip {{mgmt.ipmask}}
            set allowaccess ping https ssh http telnet fgfm
            set alias "OOB Management"
            set vrf {{mgmt.vrfid}}
        next
    end
{% else %}
    config system interface
        edit "OOB_MGMT"
            set vdom "root"
            set interface "{{mgmt.interface}}"
            set vlanid {{mgmt.vlanid}}
            set mode static
            set ip {{mgmt.ipmask}}
            set allowaccess ping https ssh http telnet fgfm
            set alias "OOB Management"
            set vrf {{mgmt.vrfid}}
        next
    end
{% endif %}

{% if HA.mode.name == 'FGCP' %}
    # Mgmt interface {{mgmt.interface}} is an ha-mgmt-interfaces
    # So we need an interface in mgmt VRF {{mgmt.vrfid}} to reach the FortiGuard servers and FMG/FAZ
    {% set rank = (mgmt.ipprefix | ipaddr('address') | ipaddr('int')) - (mgmt.ipprefix | ipaddr('network') | ipaddr('int')) %}
    config system interface
        edit "mgmt_cluster"
            set vdom "root"
            set ip {{'172.16.32.0/24'|ipaddr('network/prefix')|ipaddr(rank)}}
            set allowaccess ping https ssh http telnet fgfm
            set interface "{{mgmt.interface}}"
            set vlanid 1010
            set vrf {{mgmt.vrfid}}
        next
    end
{% endif %}