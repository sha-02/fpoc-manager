{# ==================== #}
{# FGT bootstrap config #}
{# ==================== #}

{% include "./global.conf" %}
{% include "./system.interface.mgmt.conf" %}
{% if HA.mode.name == 'FGCP' and HA.role.name == 'SECONDARY' %}
    {# Only deploy minimum HA settings to HA secondary devices #}
    {% include "./HA.secondary.conf" %}
{% else %}
    {% include "./system.interface.wan.conf" %}
    {% include "./npu.conf" %}
    {% include "./system.alias.conf" %}
    {% include "./firewall.address.conf" %}
    {% if HA.mode.name == 'FGCP' and HA.role.name == 'PRIMARY' %}
        {% include "./HA.primary.conf" %}
    {% else %}
        {% include "./routing.conf" %}
    {% endif %}
{% endif %}
