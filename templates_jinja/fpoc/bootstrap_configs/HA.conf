{% if HA.mode.name == 'FGCP' %}
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        config gui-dashboard
            edit 1
                config widget
                    edit 0
                        set type ha-status
                        set x-pos 3
                        set width 1
                        set height 1
                    next
                end
            next
        end
    next
end

{% for tuple in HA.hbdev %}
    config system interface
        edit "{{tuple.0}}"
            set alias "HA heartbeat"
        next
    end
{% endfor %}

{% for dev in HA.sessyncdev %}
    config system interface
        edit "{{dev}}"
            set alias "HA session-sync"
        next
    end
{% endfor %}

config system ha
    set mode a-p
    set group-id {{HA.group_id}}
    set group-name "{{HA.group_name}}"
    set password fortinet

    # force session-sync in kernel instead of userspace for performance
    # spread load on multiple NPU interface for performance and redundancy
    set hbdev {% for tuple in HA.hbdev %}{{tuple.0}} {{tuple.1}} {% endfor %}
    set session-sync-dev {% for dev in HA.sessyncdev %}{{dev}} {% endfor %}

    # load-balance session-sync load between multiple CPUs for performance
    set sync-packet-balance enable

    # Keep the routes long enough in the FIB of the new Master
    set route-ttl 300

    # Master quickly updates the FIB of the Slave on route change
    set route-hold 1

    # Improve detection of HA switchover by Layer-2
    set arps 10
    set arps-interval 1
    set link-failed-signal enable

    # Synchronize TCP and UDP sessions which have existed for more than 30 seconds
    set session-pickup enable
    set session-pickup-connectionless enable
    # For PoCs, do not enable session-pickup-delay
    set session-pickup-delay disable

    # Prevent quick failover/failback for IPsec HA to work correctly (0677552)
    set failover-hold-time 1

    # For Master Election process
    set ha-uptime-diff-margin 120
    set override disable
    set priority {{HA.priority}}
    set monitor {% for dev in HA.monitordev %}{{dev}} {% endfor %}

    # Upgrade Slave first, then Slave becomes Master, then old-Master is upgraded
    set upgrade-mode uninterruptible

    # per-member management
    set ha-mgmt-status enable
    config ha-mgmt-interfaces
        edit 1
            set interface "{{mgmt.interface}}"
            set gateway {{poc.gw}}
        next
    end

end

{% if WAN_underlays|default(false) %}
    config system dns
        set primary 8.8.8.8
    end

    config router static
        edit 1
            set device "{{wan.inet.port}}"
            set gateway {{wan.inet.subnet}}.254
            set comment "Default-route via {{wan.inet.port}}"
        next
    end
{% endif %} {# WAN_underlays #}

{% endif %} {# HA #}
